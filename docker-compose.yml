# StationIQ Web – Docker run from this folder
#
# The image does not include `.env` (see .dockerignore). `NEXT_PUBLIC_*` is compiled into the
# client bundle at **build** time (`build.args`); change those values, then rebuild:
#   docker compose build --no-cache && docker compose up -d
#
# `env_file` + bind mount `/app/.env` mirror local dev and surface vars on `process.env`.
# Interpolation for ${…} uses `.env` in this directory (Compose project file). From here:
#   docker compose --env-file .env up --build -d
#
# Variable names match `.env.local.example`.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set NEXT_PUBLIC_SUPABASE_ANON_KEY in .env}
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      # Same as build.args (runtime for server / tooling; client bundle still requires rebuild)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in .env}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set NEXT_PUBLIC_SUPABASE_ANON_KEY in .env}
    restart: unless-stopped
