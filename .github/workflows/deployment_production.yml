# Production: push to main — minor version bump, push to Docker Hub.
# Tags: :<semver>, :latest, :sha-<commit>
#
# GitHub Environment: prod
# Required environment secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# Optional environment variables: NEXT_PUBLIC_API_URL, NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
name: StationIQ Web — Deployment (Production)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-production
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: kayiganwa/stationiq_web

jobs:
  deploy-production:
    name: Build, test & publish production image
    runs-on: ubuntu-latest
    environment: prod
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve pnpm store path
        shell: bash
        run: |
          STORE_PATH="$(pnpm store path --silent 2>/dev/null || true)"
          if [ -z "$STORE_PATH" ]; then
            STORE_PATH="${HOME}/.local/share/pnpm/store"
          fi
          echo "STORE_PATH=${STORE_PATH}" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-web-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-web-

      - run: pnpm install --frozen-lockfile
        env:
          CI: "true"

      - run: pnpm run lint
      - run: pnpm test
        env:
          CI: "true"
      - run: pnpm run build

      - name: Resolve NEXT_PUBLIC_* for Docker build
        id: bake
        env:
          V_API: ${{ vars.NEXT_PUBLIC_API_URL }}
          V_SU: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          V_SK: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          API="${V_API:-http://localhost:3000}"
          echo "api_url=${API}" >> "$GITHUB_OUTPUT"
          echo "supa_url=${V_SU}" >> "$GITHUB_OUTPUT"
          echo "supa_key=${V_SK}" >> "$GITHUB_OUTPUT"

      - name: Bump minor version (production)
        id: version
        run: |
          chmod +x .github/scripts/bump-version.sh
          .github/scripts/bump-version.sh VERSION package.json true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker tags (production)
        id: dockertags
        run: |
          TAGS="${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.version }}"
          TAGS="${TAGS},${{ env.DOCKERHUB_IMAGE }}:latest"
          TAGS="${TAGS},${{ env.DOCKERHUB_IMAGE }}:sha-${{ github.sha }}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.dockertags.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.bake.outputs.api_url }}
            NEXT_PUBLIC_SUPABASE_URL=${{ steps.bake.outputs.supa_url }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ steps.bake.outputs.supa_key }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.environment=production
          cache-from: type=gha,scope=web-production
          cache-to: type=gha,mode=max,scope=web-production

      - name: Commit production version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json
          git diff --staged --quiet && exit 0
          git commit -m "chore(web): production release v${{ steps.version.outputs.version }} [skip ci]"
          git push
