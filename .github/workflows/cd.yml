# Standalone Web repo: push image to GHCR (manual or tag web-v*).
# Optional repo Variables: NEXT_PUBLIC_API_URL, NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
name: Web CD
on:
  workflow_dispatch:
  push:
    tags:
      - "web-v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Registry image name (lowercase)
        id: image
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${OWNER_LC}/stationiq-web" >> "$GITHUB_OUTPUT"

      - name: Resolve NEXT_PUBLIC_* for Docker build
        id: bake
        env:
          V_API: ${{ vars.NEXT_PUBLIC_API_URL }}
          V_SU: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          V_SK: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          API="${V_API:-http://localhost:3000}"
          echo "api_url=${API}" >> "$GITHUB_OUTPUT"
          echo "supa_url=${V_SU}" >> "$GITHUB_OUTPUT"
          echo "supa_key=${V_SK}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.bake.outputs.api_url }}
            NEXT_PUBLIC_SUPABASE_URL=${{ steps.bake.outputs.supa_url }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ steps.bake.outputs.supa_key }}
          cache-from: type=gha,scope=web-publish
          cache-to: type=gha,mode=max,scope=web-publish
